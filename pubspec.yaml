name: web_view_app
description: "건강해짐 애플리케이션"
version: 1.1.0+5
publish_to: 'none'

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^22.2.0
  permission_handler: ^13.0.0
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  fluttertoast: ^10.0.0
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
# 스플래시 — 배경색은 앱 아이콘 배경(#1890FF)과 같게 맞춰 아이콘 경계가 보이지 않게 한다.
# 수정 후 `dart run flutter_native_splash:create`로 네이티브 리소스를 다시 생성한다.
flutter_native_splash:
  color: "#1890FF"
  image: assets/icon/icon.png
  android_12:
    color: "#1890FF"
    image: assets/icon/icon.png
    icon_background_color: "#1890FF"
