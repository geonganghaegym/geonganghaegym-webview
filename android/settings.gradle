pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.13.2" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.5.0" apply false
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
    // Play Console 업로드/트랙 배정/출시노트를 브라우저 대신 API로 처리한다.
    // 4.0.0+는 AGP 9.0.0+를 요구한다. 2026-09-27 AGP 9.4.0 + GPP 4.1.1로 전환을 시도했으나
    // flutter_inappwebview_android 1.1.3(2026-09-27 기준 pub 최신)의 android/build.gradle이
    // AGP9에서 제거된 getDefaultProguardFile('proguard-android.txt')를 호출해 assembleDebug
    // 단계에서 즉시 실패했다(첫 번째로 걸린 차단 요인 — kotlin-android 플러그인과 AGP9 내장
    // Kotlin 간 충돌 등 다른 이슈가 있는지는 이 지점 이후를 확인하지 못해 알 수 없다).
    // 그래서 AGP 8.13.2 + GPP 3.13.0을 유지한다.
    id "com.github.triplet.play" version "3.13.0" apply false
}

include ":app"
